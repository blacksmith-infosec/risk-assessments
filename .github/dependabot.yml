version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    reviewers:
      - "jcasner"
    groups:
      eslint:
        patterns:
        - "eslint*"
        - "@eslint*"
      i18next:
        patterns:
        - "i18next*"
        - "i18next-browser-languagedetector"
      react:
        patterns:
        - "react*dom"
        - "react"
        - "@types/react*"
      vite:
        patterns:
        - "vite*"
        - "@vite*"
